# Weekly updates for the pnpm lockfile and the pinned actions (spec/SPEC-repo-security.md, section 5). The cooldown
# gives a hijacked release time to be caught before a PR appears. Container images in the workflows are bumped by hand,
# together with the playwright package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions:
        update-types: [minor, patch]
