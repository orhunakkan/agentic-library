name: Deploy to production

# Asks the server to deploy a commit that dev has already run: Actions, "Deploy to production", "Run workflow", or
# `gh workflow run deploy-prod.yml -f sha=<full sha>`. This job checks the commit, so that a mistake fails here with its
# reason, but the server's poller (scripts/deploy/poll.ts) checks it again for itself and is the real boundary.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to promote. Leave empty for the newest commit on main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Request the production deploy
    # A re-run started by anyone else is refused as well, through triggering_actor.
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # to check that CI passed for the commit
      contents: read # to check that the commit is on main
      deployments: write # to read dev's deployments, and to create the production one
    steps:
      - name: Check the commit dev tested, then ask the server to deploy it
        env:
          SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() { echo "Not deployed: $1" >&2; exit 1; }
          case "$SHA" in
            *[!0-9a-f]* | '') refuse "not a commit SHA: $SHA" ;;
          esac
          if [ "${#SHA}" -ne 40 ]; then refuse "use the full 40-character SHA"; fi

          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status) || refuse "$SHA isn't in this repository"
          case "$relation" in
            identical | behind) ;;
            *) refuse "$SHA isn't on main" ;;
          esac

          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=success" --jq .total_count)
          if [ "$passed" -eq 0 ]; then refuse "CI hasn't passed for $SHA on main"; fi

          tested=no
          for deployment in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=dev" --jq '.[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" --jq '.[].state' | grep -qx success; then
              tested=yes
            fi
          done
          if [ "$tested" != yes ]; then refuse "dev hasn't deployed $SHA successfully"; fi

          printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"production_environment":true,"description":"Promoted from dev"}' "$SHA" |
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '"Deployment \(.id) requested for production"'
          echo "Production deploy requested for $SHA: https://agenticlibrary.app" >> "$GITHUB_STEP_SUMMARY"
