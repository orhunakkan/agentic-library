name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to promote. Leave empty for the newest commit on main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to production
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Promote the release dev tested
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          case "$SHA" in
            *[!0-9a-f]* | '') echo "Not a commit SHA: $SHA" >&2; exit 1 ;;
          esac
          if [ "${#SHA}" -ne 40 ]; then echo "Use the full 40-character SHA" >&2; exit 1; fi
          sudo -n /usr/local/bin/agentic-library-deploy prod "$SHA"
          echo "Production is now $SHA: https://agenticlibrary.app" >> "$GITHUB_STEP_SUMMARY"
